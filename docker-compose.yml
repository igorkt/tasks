version: '2'
services:
  php:
    image: yiisoftware/yii2-php:8.4-fpm-latest-nginx
    volumes:
      - ~/.composer-docker/cache:/root/.composer/cache:delegated
      - ./:/app:delegated
    ports:
      - '8000:80'
    command: composer update && php yii migrate


  mysql:
    image: mysql:8.0.43
    ports:
      - 33060:3306
    environment:
      - MYSQL_ROOT_PASSWORD=verysecret
      - MYSQL_DATABASE=yii2basic
      - MYSQL_USER=yii2basic
      - MYSQL_PASSWORD=secret